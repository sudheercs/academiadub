name: Deploy Backend → Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: backend-deploy
  cancel-in-progress: false   # Never cancel a mid-flight deploy

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render deploy
        # Render auto-deploys on push to main when connected to GitHub.
        # This step also supports manual deploys via the Render Deploy Hook URL.
        # Add RENDER_DEPLOY_HOOK_URL as a GitHub secret — get it from:
        #   Render dashboard → your service → Settings → Deploy Hook
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for deploy to go live
        # Poll the health endpoint until the new version is up (max 5 min)
        run: |
          echo "Waiting for new deployment to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl --silent --max-time 10 \
              "${{ secrets.NEXT_PUBLIC_API_URL }}/api/health/" \
              | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "✅ Backend is live and healthy."
              exit 0
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "::error::Health check timed out after 5 minutes."
          exit 1
