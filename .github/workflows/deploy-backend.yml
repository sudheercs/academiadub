name: Deploy Backend → Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Wait for Render auto-deploy to go live
        run: |
          echo "Waiting for Render auto-deploy to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl --silent --max-time 10 \
              "https://academiadub-api.onrender.com/api/health/" \
              | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "✅ Backend is live and healthy."
              exit 0
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "::warning::Health check timed out after 5 minutes. Check Render dashboard."
          exit 0