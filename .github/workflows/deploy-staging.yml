name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, push & deploy to AWS ap-south-1 staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false   # Never cancel a mid-flight deploy

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/academiadub-api:$IMAGE_TAG \
            -t $REGISTRY/academiadub-api:latest \
            ./backend
          docker push $REGISTRY/academiadub-api:$IMAGE_TAG
          docker push $REGISTRY/academiadub-api:latest

      - name: Build & push Web image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --target production \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }} \
            -t $REGISTRY/academiadub-web:$IMAGE_TAG \
            -t $REGISTRY/academiadub-web:latest \
            ./frontend
          docker push $REGISTRY/academiadub-web:$IMAGE_TAG
          docker push $REGISTRY/academiadub-web:latest

      - name: Run DB migrations (one-off ECS task)
        run: |
          aws ecs run-task \
            --cluster academiadub-staging \
            --task-definition academiadub-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.SUBNET_IDS }}],
              securityGroups=[${{ secrets.SG_ID }}],
              assignPublicIp=DISABLED
            }" \
            --overrides '{"containerOverrides":[{
              "name":"api",
              "command":["python","manage.py","migrate","--noinput"]
            }]}'

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster academiadub-staging \
            --service academiadub-api \
            --force-new-deployment

      - name: Deploy Web service
        run: |
          aws ecs update-service \
            --cluster academiadub-staging \
            --service academiadub-web \
            --force-new-deployment

      - name: Wait for deployment to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster academiadub-staging \
            --services academiadub-api academiadub-web

      - name: Smoke test — health check
        run: |
          curl --fail --max-time 10 --retry 3 --retry-delay 5 \
            ${{ secrets.STAGING_API_URL }}/api/health/ \
            | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          echo "✅ Staging health check passed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed for commit ${{ github.sha }}"
          # TODO: add Slack / email notification here
