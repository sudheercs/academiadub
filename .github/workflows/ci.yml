name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:

  # ── Backend: lint, test, security scan ──────────────────────────────────────
  backend:
    name: Backend — lint, test, scan
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: test_academiadub
          MYSQL_USER: academiadub
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: rootpassword
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Lint — ruff
        run: ruff check .
        working-directory: backend

      - name: Lint — black (format check)
        run: black --check .
        working-directory: backend

      - name: Lint — isort
        run: isort --check-only .
        working-directory: backend

      - name: Security scan — bandit
        run: bandit -r apps/ academiadub/ -ll -x "*/tests/*,*/migrations/*"
        working-directory: backend

      - name: Dependency audit — pip-audit
        run: pip-audit -r requirements.txt
        working-directory: backend

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: academiadub.settings.local
          DATABASE_URL: mysql://academiadub:testpassword@127.0.0.1:3306/test_academiadub
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "true"
          ALLOWED_HOSTS: localhost
        run: |
          python manage.py migrate --noinput
          python manage.py test --verbosity=2

  # ── Frontend: lint, type-check, build ────────────────────────────────────────
  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint — ESLint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend
