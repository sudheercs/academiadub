# AcademiaHub — local development environment
# Usage: docker compose up --build
# All services run in Docker; no local Python/Node install required for dev.

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academiadub
      POSTGRES_USER: academiadub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academiadub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Django REST Framework API ─────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app          # hot-reload: edits reflect immediately
      - runner_socket:/run/coderunner
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: academiadub.settings.local
      DATABASE_URL: postgres://academiadub:${POSTGRES_PASSWORD:-localpassword}@db:5432/academiadub
      REDIS_URL: redis://redis:6379/0
      CODE_RUNNER_SOCKET: /run/coderunner/runner.sock
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      coderunner:
        condition: service_healthy

  # ── Next.js 14 Frontend ───────────────────────────────────────────────────
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules        # isolate container node_modules from host
      - /app/.next               # isolate .next cache
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_INTERNAL_API_URL: http://api:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Isolated code runner ───────────────────────────────────────────────────
  coderunner:
    build:
      context: ../coderunner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MAX_RUNTIME_SECONDS: "5"
      ALLOWED_LANGUAGES: "python,javascript"
      CODE_RUNNER_SOCKET: /run/coderunner/runner.sock
    volumes:
      - runner_socket:/run/coderunner
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - KILL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/coderunner/runner.sock'); s.sendall(b'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n'); assert b'200 OK' in s.recv(1024)"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
    name: academiadub_default

volumes:
  postgres_data:
    name: academiadub_postgres
  runner_socket:
    name: academiadub_runner_socket
