# AcademiaHub — local development environment
# Usage: docker compose up --build
# All services run in Docker; no local Python/Node install required for dev.

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academiadub
      POSTGRES_USER: academiadub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academiadub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Django REST Framework API ─────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app          # hot-reload: edits reflect immediately
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: academiadub.settings.local
      DATABASE_URL: postgres://academiadub:${POSTGRES_PASSWORD:-localpassword}@db:5432/academiadub
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js 14 Frontend ───────────────────────────────────────────────────
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules        # isolate container node_modules from host
      - /app/.next               # isolate .next cache
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_INTERNAL_API_URL: http://api:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Code Runner (sandboxed stub — hardened in Phase 5) ───────────────────
  coderunner:
    build:
      context: ../coderunner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MAX_RUNTIME_SECONDS: "5"
      ALLOWED_LANGUAGES: "python,javascript"
    ports:
      - "9000:9000"
    networks:
      - default
      - runner_net
    # Intentionally NO access to db or redis from runner_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
    name: academiadub_default
  runner_net:
    name: academiadub_runner
    internal: true   # no internet access from this network

volumes:
  postgres_data:
    name: academiadub_postgres
